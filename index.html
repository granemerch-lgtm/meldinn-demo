<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MeldInn – meld fra om feil</title>
<meta name="description" content="Meld inn ødelagte gatelys, hull i veien, søppel og mer. Ta bilde, bekreft sted, send.">
<meta name="theme-color" content="#0F626B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MeldInn">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="shared/meldinn-core.js"></script>
<script src="shared/icons.js"></script>
<script src="shared/store.js"></script>
<style>
:root{
  --petrol:#0F626B; --orange:#F97821; --offwhite:#F5F4EF; --marine:#18364A; --white:#FFFFFF;
  --petrol-light:#E3EFF0; --petrol-line:#BCD8DB; --orange-light:#FEF0E5; --orange-line:#FBC9A3;
  --marine-muted:#5A6B78; --line:#DEDCD3; --err:#C2410C; --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--offwhite);color:var(--marine);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px}
button{font:inherit;cursor:pointer}
svg.i{width:1em;height:1em;vertical-align:-0.15em;flex-shrink:0}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{background:var(--petrol);color:var(--white);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:1000}
header img{width:34px;height:34px;border-radius:9px}
header h1{font-size:20px;margin:0;flex:1;letter-spacing:.3px}
header .muni{font-size:13px;opacity:.85}
.back{background:none;border:none;color:var(--white);font-size:26px;padding:0 6px 0 0;line-height:1;display:flex}
main{flex:1;padding:16px 16px calc(90px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--white);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:1000}
nav.tabs button{flex:1;background:none;border:none;padding:10px 4px 12px;color:var(--marine-muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button.active{color:var(--petrol);font-weight:700}
nav.tabs svg{width:24px;height:24px}
.card{background:var(--white);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #18364A14}
.big-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;border:none;border-radius:20px;
  background:var(--orange);color:var(--white);font-size:22px;font-weight:800;padding:26px 16px;box-shadow:0 4px 14px #F9782155}
.big-btn svg.i{font-size:30px}
.big-btn:disabled{opacity:.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;
  background:var(--petrol);color:var(--white);font-size:17px;font-weight:600;padding:15px 18px;width:100%;text-decoration:none}
.btn svg.i{font-size:20px}
.btn.secondary{background:var(--white);color:var(--petrol);border:2px solid var(--petrol)}
.btn.orange{background:var(--orange)}
.btn.small{width:auto;padding:9px 14px;font-size:15px;border-radius:11px}
.row{display:flex;gap:10px}.row>*{flex:1}
h2{font-size:22px;margin:4px 0 12px;color:var(--petrol);display:flex;align-items:center;gap:8px}
h3{font-size:17px;margin:0 0 8px;color:var(--petrol)}
p.lead{color:var(--marine-muted);margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--white);border:2px solid transparent;border-radius:18px;padding:18px 10px;text-align:center;font-weight:600;
  font-size:17px;color:var(--marine);box-shadow:0 1px 3px #18364A14}
.tile .ic{font-size:36px;display:flex;justify-content:center;margin-bottom:8px;color:var(--petrol)}
.tile.sel{border-color:var(--orange);background:var(--orange-light)}
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--orange)}
#pickmap{height:300px;border-radius:var(--radius);overflow:hidden;margin-bottom:12px;z-index:1}
#bigmap{height:calc(100vh - 230px);min-height:340px;border-radius:var(--radius);overflow:hidden}
.photo-prev{width:100%;max-height:280px;object-fit:cover;border-radius:var(--radius);margin-bottom:12px;display:block;background:var(--petrol-light)}
.photo-drop{border:3px dashed var(--orange-line);border-radius:var(--radius);padding:40px 16px;text-align:center;color:var(--orange);
  background:var(--orange-light);font-weight:700;margin-bottom:12px;display:block}
.photo-drop .ic{font-size:52px;display:flex;justify-content:center;margin-bottom:6px}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:var(--white);color:var(--marine)}
textarea:focus,input:focus{outline:2px solid var(--petrol);border-color:var(--petrol)}
textarea{min-height:90px;resize:vertical}
label.l{display:block;font-weight:600;margin:12px 0 6px;font-size:15px}
.list-item{display:flex;gap:12px;align-items:center;background:var(--white);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #18364A14;width:100%;border:none;text-align:left;color:inherit}
.list-item .thumb{width:58px;height:58px;border-radius:12px;background:var(--petrol-light);color:var(--petrol);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;overflow:hidden}
.list-item .thumb img{width:100%;height:100%;object-fit:cover}
.list-item .meta{flex:1;min-width:0}
.list-item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .s{font-size:14px;color:var(--marine-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:4px 9px;border-radius:20px;color:var(--white);white-space:nowrap}
.st-Mottatt{background:var(--marine-muted)}.st-Under{background:var(--marine)}.st-Tildelt{background:var(--petrol)}
.st-Utført{background:var(--orange)}.st-Løst{background:var(--white);color:var(--petrol);box-shadow:inset 0 0 0 2px var(--petrol)}
.timeline{border-left:3px solid var(--line);margin:8px 0 0 8px;padding-left:16px}
.timeline .ev{position:relative;margin-bottom:14px}
.timeline .ev:before{content:"";position:absolute;left:-23px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--petrol)}
.timeline .ev.public:before{background:var(--orange)}
.timeline .ev.public{background:var(--orange-light);border-radius:10px;padding:8px 10px}
.timeline .ev small{color:var(--marine-muted);display:block}
.notice{background:var(--orange-light);border:1px solid var(--orange-line);border-radius:14px;padding:12px;margin-bottom:12px;font-size:15px}
.success{text-align:center;padding:30px 10px}
.success .ic{font-size:76px;color:var(--petrol);display:flex;justify-content:center}
.success .nr{font-size:28px;font-weight:800;color:var(--orange);letter-spacing:1px;margin:8px 0}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);background:var(--marine);color:var(--white);
  padding:12px 18px;border-radius:14px;z-index:3000;font-size:15px;box-shadow:0 6px 20px #0004;max-width:92%;display:flex;gap:8px;align-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px;margin-top:10px}
.kv dt{color:var(--marine-muted)}.kv dd{margin:0}
.muted{color:var(--marine-muted);font-size:14px}
.install{display:none;margin-bottom:14px}
.dup{background:var(--petrol-light);border:1px solid var(--petrol-line);border-radius:14px;padding:12px;margin-bottom:12px}
.catrow{display:flex;gap:12px;align-items:center}
.catrow .cic{font-size:30px;color:var(--petrol);display:flex}
.iconline{display:flex;align-items:center;gap:6px}
.demo{display:inline-block;background:var(--orange-light);color:var(--err);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
.loading{text-align:center;color:var(--marine-muted);padding:40px 0}
.leaflet-container{font:inherit}
.pin{width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid var(--white);box-shadow:0 2px 6px #0005;display:flex;align-items:center;justify-content:center}
.pin i{transform:rotate(45deg);font-style:normal;font-size:15px;color:var(--white);display:flex}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="back" id="backBtn" style="display:none" aria-label="Tilbake"></button>
    <img src="icons/icon-192.png" alt="">
    <h1>MeldInn</h1>
    <span class="muni" id="muni"></span>
  </header>
  <main id="view"><div class="loading">Laster…</div></main>
  <nav class="tabs" id="tabs"></nav>
</div>

<script>
const C=MeldInnCore, S=MeldInnStore, ic=MeldInnIcon, cic=MeldInnCatIcon;
const STATUS_COLORS={"Mottatt":"#5A6B78","Under behandling":"#18364A","Tildelt":"#0F626B","Utført":"#F97821","Løst":"#0F626B"};
const MYKEY="meldinn_mine_v1";
let CFG=null, VIS=null;

const $view=document.getElementById("view"), $tabs=document.getElementById("tabs"), $back=document.getElementById("backBtn");
$back.innerHTML=ic("chevronLeft",2.5);
let stack=[], maps=[], curTab=null, curArg=null, draft=null;

function mine(){ try{return JSON.parse(localStorage.getItem(MYKEY))||[]}catch(e){return []} }
function addMine(id){ const m=mine(); if(!m.includes(id)){m.push(id);localStorage.setItem(MYKEY,JSON.stringify(m));} }
function fmt(iso){ const d=new Date(iso); return d.toLocaleDateString("no-NO",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("no-NO",{hour:"2-digit",minute:"2-digit"}); }
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function badge(s){ return `<span class="badge st-${s.split(" ")[0]}">${s}</span>`; }
function title(c){ return c.desc || C.CATS[c.cat]; }
function toast(msg,icon){ const t=document.createElement("div"); t.className="toast"; t.innerHTML=(icon?ic(icon):"")+`<span>${esc(msg)}</span>`; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
function clearMaps(){ maps.forEach(m=>{try{m.remove()}catch(e){}}); maps=[]; }
function pinIcon(c){ return L.divIcon({className:"",html:`<div class="pin" style="background:${STATUS_COLORS[c.status]||"#0F626B"}"><i>${cic(c.cat)}</i></div>`,iconSize:[32,32],iconAnchor:[16,32],popupAnchor:[0,-30]}); }
function makeMap(el,center,zoom){
  if(typeof L==="undefined"){ document.getElementById(el).innerHTML='<div class="notice">Kartet krever nettilgang.</div>'; return null; }
  const m=L.map(el).setView(center,zoom);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(m);
  maps.push(m); setTimeout(()=>m.invalidateSize(),60); return m;
}
const TABS=[["home","Meld inn","home"],["kart","Kart","mapPin"],["mine","Mine saker","list"]];
function renderTabs(){
  $tabs.innerHTML=TABS.map(([k,l,i])=>`<button data-k="${k}" class="${k===curTab?"active":""}">${ic(i)}<span>${l}</span></button>`).join("");
  $tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>{stack=[];go(b.dataset.k)});
}
async function go(tab,arg,push){
  if(push) stack.push([curTab,curArg]);
  clearMaps(); curTab=tab; curArg=arg; renderTabs();
  $back.style.display=stack.length?"flex":"none"; window.scrollTo(0,0);
  try{ await (VIEWS[tab]||VIEWS.home)(arg); }
  catch(e){ $view.innerHTML=`<div class="notice">Noe gikk galt: ${esc(e.message)}</div>`; }
}
$back.onclick=()=>{ const p=stack.pop(); if(p) go(p[0],p[1]); };
function item(c){
  return `<button class="list-item" data-id="${c.id}"><div class="thumb">${c.hasPhoto?`<img src="${S.photoUrl(c.id,"before")}" alt="">`:cic(c.cat)}</div>
    <div class="meta"><div class="t">${esc(title(c))}</div><div class="s">${c.id} · ${C.CATS[c.cat]} · ${fmt(c.created)}</div></div>${badge(c.status)}</button>`;
}
function bindItems(){ $view.querySelectorAll(".list-item[data-id]").forEach(b=>b.onclick=()=>go("sak",b.dataset.id,true)); }

const VIEWS={};
VIEWS.home=async()=>{
  const list=VIS.showOthers?await S.listPublic():[];
  const open=list.filter(c=>c.status!=="Løst").length, solved=list.filter(c=>c.status==="Løst").length;
  $view.innerHTML=`
    <div class="card install" id="installCard"><b>Installer MeldInn</b><p class="muted" style="margin:4px 0 10px">Legg appen på hjemskjermen – ingen App Store nødvendig.</p><button class="btn small" id="installBtn">${ic("download")} Installer</button></div>
    <h2>Ser du noe som er ødelagt?</h2>
    <p class="lead">Ta et bilde, bekreft stedet og trykk send. Ingen konto eller innlogging.</p>
    <button class="big-btn" id="startBtn">${ic("camera")} Meld inn et problem</button>
    <div style="height:14px"></div>
    <div class="row">
      ${VIS.showOthers?`<button class="btn secondary" onclick="go('kart')">${ic("map")} Se meldte saker</button>`:""}
      <button class="btn secondary" onclick="go('mine')">${ic("clipboard")} Mine saker</button>
    </div>
    ${VIS.showOthers?`<div style="height:16px"></div><div class="card"><div class="row" style="text-align:center">
      <div><b style="font-size:26px;color:var(--petrol)">${open}</b><div class="muted">åpne saker</div></div>
      <div><b style="font-size:26px;color:var(--marine)">${solved}</b><div class="muted">nylig fikset</div></div>
      <div><b style="font-size:26px;color:var(--orange)">3</b><div class="muted">trykk for å melde</div></div>
    </div></div>`:""}
    <p class="muted" style="text-align:center">${esc(CFG.municipality)}${S.mode==="local"?' · <span class="demo">Demomodus – lagres kun på denne enheten</span>':""}</p>`;
  document.getElementById("startBtn").onclick=()=>{ draft={cat:null,photo:null,lat:null,lng:null,desc:"",contact:""}; go("m1",null,true); };
  if(deferredPrompt) showInstall();
};
function steps(n){ return `<div class="steps">${[1,2,3,4].map(i=>`<span class="${i<=n?"on":""}"></span>`).join("")}</div>`; }
VIEWS.m1=()=>{
  $view.innerHTML=`${steps(1)}<h2>Hva gjelder det?</h2><div class="grid">${
    Object.entries(C.CATS).map(([k,n])=>`<button class="tile ${draft.cat===k?"sel":""}" data-k="${k}"><span class="ic">${cic(k)}</span>${n}</button>`).join("")}</div>`;
  $view.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{draft.cat=b.dataset.k; go("m2",null,true);});
};
VIEWS.m2=()=>{
  $view.innerHTML=`${steps(2)}<h2>Ta et bilde</h2><p class="lead">Et bilde hjelper oss å forstå problemet raskere. Unngå å ta bilde av personer og bilskilt.</p>
    <input type="file" id="cam" accept="image/*" capture="environment" hidden>
    ${draft.photo?`<img class="photo-prev" src="${draft.photo}">`:`<label for="cam" class="photo-drop"><span class="ic">${ic("camera",1.75)}</span>Trykk for å ta bilde</label>`}
    ${draft.photo?`<button class="btn secondary" id="retake">${ic("camera")} Ta nytt bilde</button><div style="height:10px"></div><button class="btn orange" id="next">Neste</button>`
      :`<button class="btn secondary" id="skip">Hopp over bilde</button>`}`;
  const cam=document.getElementById("cam");
  cam.onchange=async e=>{ const f=e.target.files[0]; if(!f) return; draft.photo=await shrink(f,1000); VIEWS.m2(); };
  document.getElementById("retake")?.addEventListener("click",()=>cam.click());
  document.getElementById("next")?.addEventListener("click",()=>go("m3",null,true));
  document.getElementById("skip")?.addEventListener("click",()=>go("m3",null,true));
};
function shrink(file,max){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{
  const s=Math.min(1,max/Math.max(img.width,img.height)); const cv=document.createElement("canvas"); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
  cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); res(cv.toDataURL("image/jpeg",0.72)); }; img.src=r.result; }; r.readAsDataURL(file); }); }

VIEWS.m3=async()=>{
  $view.innerHTML=`${steps(3)}<h2>Bekreft stedet</h2><p class="lead">Dra nålen til riktig sted om nødvendig.</p>
    <div id="pickmap"></div><div id="dupBox"></div>
    <button class="btn secondary" id="gps">${ic("locate")} Bruk min posisjon</button><div style="height:10px"></div>
    <button class="btn orange" id="next">${ic("check")} Stedet stemmer</button>`;
  const nearby=VIS.showOthers?await S.listPublic().catch(()=>[]):[];
  const start=draft.lat?[draft.lat,draft.lng]:CFG.center;
  const m=makeMap("pickmap",start,16); if(!m){ draft.lat=start[0]; draft.lng=start[1]; }
  let mk=null;
  const checkDup=()=>{
    const box=document.getElementById("dupBox"); if(!box) return;
    const near=nearby.filter(c=>c.status!=="Løst"&&c.cat===draft.cat&&C.dist(c.lat,c.lng,draft.lat,draft.lng)<120);
    box.innerHTML=near.length?`<div class="dup"><b>Allerede meldt i nærheten?</b><p class="muted" style="margin:4px 0 8px">Følg saken i stedet, så slipper vi dobbeltmeldinger.</p>${
      near.map(c=>`<button class="list-item" data-id="${c.id}"><div class="thumb">${cic(c.cat)}</div><div class="meta"><div class="t">${esc(title(c))}</div><div class="s">${c.id} · ca. ${Math.round(C.dist(c.lat,c.lng,draft.lat,draft.lng))} m unna</div></div>${badge(c.status)}</button>`).join("")}</div>`:"";
    box.querySelectorAll("[data-id]").forEach(b=>b.onclick=async()=>{ await S.follow(b.dataset.id); addMine(b.dataset.id); toast("Du følger nå sak "+b.dataset.id,"bell"); stack=[]; go("sak",b.dataset.id); });
  };
  const setPos=(lat,lng)=>{ draft.lat=lat; draft.lng=lng; if(m){ if(!mk){ mk=L.marker([lat,lng],{draggable:true}).addTo(m);
      mk.on("dragend",()=>{const p=mk.getLatLng(); setPos(p.lat,p.lng);}); } else mk.setLatLng([lat,lng]); } checkDup(); };
  if(m){ m.on("click",e=>setPos(e.latlng.lat,e.latlng.lng)); setPos(start[0],start[1]); }
  const locate=()=>{ if(!navigator.geolocation){toast("Posisjon ikke tilgjengelig","info");return;}
    navigator.geolocation.getCurrentPosition(p=>{ setPos(p.coords.latitude,p.coords.longitude); m&&m.setView([p.coords.latitude,p.coords.longitude],17); },
      ()=>toast("Fikk ikke posisjon – dra nålen manuelt","info"),{enableHighAccuracy:true,timeout:8000}); };
  document.getElementById("gps").onclick=locate;
  if(!draft.lat||draft.lat===CFG.center[0]) locate();
  document.getElementById("next").onclick=()=>go("m4",null,true);
};
VIEWS.m4=()=>{
  $view.innerHTML=`${steps(4)}<h2>Noe mer vi bør vite?</h2>
    <div class="card"><div class="catrow"><div class="cic">${cic(draft.cat)}</div><div style="flex:1"><b>${C.CATS[draft.cat]}</b><div class="muted">${draft.lat.toFixed(4)}, ${draft.lng.toFixed(4)}</div></div>
    ${draft.photo?`<img src="${draft.photo}" style="width:64px;height:64px;object-fit:cover;border-radius:10px">`:""}</div></div>
    <label class="l">Kort beskrivelse (valgfritt)</label><textarea id="desc" maxlength="500" placeholder="F.eks. «Lyset har vært ute i en uke»">${esc(draft.desc)}</textarea>
    <label class="l">Vil du få beskjed når det er fikset? (valgfritt)</label><input type="text" id="contact" maxlength="120" placeholder="E-post eller mobilnummer" value="${esc(draft.contact)}">
    <p class="muted">Kontaktinfo vises bare for kommunen.</p>
    <button class="big-btn" id="send">${ic("send")} Send inn</button>`;
  const btn=document.getElementById("send");
  btn.onclick=async()=>{
    btn.disabled=true;
    draft.desc=document.getElementById("desc").value.trim(); draft.contact=document.getElementById("contact").value.trim();
    try{
      const c=await S.create({cat:draft.cat,lat:draft.lat,lng:draft.lng,desc:draft.desc,contact:draft.contact,photo:draft.photo});
      addMine(c.id); draft=null; stack=[]; go("kvittering",c.id);
    }catch(e){ btn.disabled=false; toast("Kunne ikke sende: "+e.message,"info"); }
  };
};
VIEWS.kvittering=(id)=>{
  $view.innerHTML=`<div class="success"><div class="ic">${ic("checkCircle",1.75)}</div><h2 style="justify-content:center">Takk! Meldingen er sendt</h2>
    <div class="muted">Saksnummer</div><div class="nr">${esc(id)}</div>
    <p class="lead">Saken er sendt til ${esc(CFG.municipality)}. Du finner den under «Mine saker».</p>
    <button class="btn" onclick="go('sak','${esc(id)}')">${ic("bell")} Følg saken</button><div style="height:10px"></div>
    <button class="btn secondary" onclick="go('home')">${ic("home")} Til forsiden</button></div>`;
};
VIEWS.mine=async()=>{
  const ids=mine(); const list=ids.length?await S.listPublic(ids):[];
  list.sort((a,b)=>b.created.localeCompare(a.created));
  $view.innerHTML=`<h2>Mine saker</h2>${list.length?list.map(item).join(""):`<div class="card"><p class="muted" style="margin:0">Du har ikke meldt inn eller fulgt noen saker ennå.</p></div>`}`;
  bindItems();
};
VIEWS.sak=async(id)=>{
  const c=await S.getPublic(id), mineNow=mine().includes(c.id);
  const kv=[["Kategori",C.CATS[c.cat]],["Meldt",fmt(c.created)]];
  if(c.supplier) kv.push(["Utføres av",esc(c.supplier)]);
  if(c.prio) kv.push(["Prioritet",c.prio]);
  if(c.cost) kv.push(["Kostnad","kr "+c.cost.toLocaleString("no-NO")]);
  $view.innerHTML=`<h2>${cic(c.cat)} ${C.CATS[c.cat]}</h2>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>${c.id}</b>${badge(c.status)}</div>
    ${c.desc?`<p>${esc(c.desc)}</p>`:""}
    ${c.hasPhoto?`<img class="photo-prev" src="${S.photoUrl(c.id,"before")}" alt="Innsendt bilde">`:""}
    ${c.hasAfter?`<h3>Etter utbedring</h3><img class="photo-prev" src="${S.photoUrl(c.id,"after")}" alt="Bilde etter utbedring">`:""}
    <dl class="kv">${kv.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    ${c.follows!==undefined?`<p class="muted iconline">${ic("users")} ${c.follows} andre følger denne saken</p>`:""}</div>
    <div class="card"><h3>Status</h3><div class="timeline">${c.history.slice().reverse().map(h=>`<div class="ev ${h.kind==="public"?"public":""}">${h.kind==="public"?`<b class="iconline">${ic("message")} Melding fra kommunen</b>`:""}${esc(h.txt)}<small>${fmt(h.t)}</small></div>`).join("")}</div></div>
    ${!mineNow?`<button class="btn" id="follow">${ic("bell")} Følg saken</button>`:""}`;
  document.getElementById("follow")?.addEventListener("click",async()=>{ await S.follow(c.id); addMine(c.id); toast("Du følger nå saken","bell"); VIEWS.sak(c.id); });
};
VIEWS.kart=async()=>{
  const list=VIS.showOthers?await S.listPublic():(mine().length?await S.listPublic(mine()):[]);
  $view.innerHTML=`<h2>${VIS.showOthers?"Meldte saker":"Mine saker på kart"}</h2>${VIS.exactLocation?"":'<p class="muted">Posisjoner vises omtrentlig.</p>'}<div id="bigmap"></div>`;
  const m=makeMap("bigmap",CFG.center,14); if(!m) return;
  list.forEach(c=>{ L.marker([c.lat,c.lng],{icon:pinIcon(c)}).addTo(m)
    .bindPopup(`<b>${C.CATS[c.cat]}</b><br>${esc(c.desc||"")}<br>${badge(c.status)}<br><a href="#">Åpne sak ${c.id}</a>`)
    .on("popupopen",e=>{ e.popup.getElement().querySelector("a").onclick=(ev)=>{ev.preventDefault();go("sak",c.id,true);} }); });
};

/* PWA */
let deferredPrompt=null;
function showInstall(){ const c=document.getElementById("installCard"); if(!c) return; c.style.display="block";
  document.getElementById("installBtn").onclick=()=>{deferredPrompt.prompt();deferredPrompt=null;c.style.display="none";}; }
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredPrompt=e; showInstall(); });
if("serviceWorker" in navigator && location.protocol!=="file:") navigator.serviceWorker.register("sw.js").catch(()=>{});

(async()=>{
  await S.init();
  CFG=await S.publicSettings(); VIS=CFG.visibility;
  document.getElementById("muni").textContent=CFG.municipality;
  go("home");
})();
</script>
</body>
</html>
